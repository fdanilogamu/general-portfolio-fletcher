<script id="rabbit-hole-destinations" type="application/json">[
{% assign destinations = site.data.rabbit_hole | where: "status", "approved" %}
{% for destination in destinations %}{% unless forloop.first %},{% endunless %}{"id": {{ destination.id | jsonify }}, "title": {{ destination.title | jsonify }}, "url": {{ destination.url | relative_url | jsonify }}, "status": {{ destination.status | jsonify }}, "category": {{ destination.category | jsonify }}}{% endfor %}
]</script>
<script src="{{ '/static/js/rabbit-hole.js' | relative_url }}" defer></script>
