<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="portfolio-version" content="v1.0.0">
  <title>{{ page.title }}</title>
  <link rel="stylesheet" href="{{ '/styles.css' | relative_url }}">
  <link rel="icon" href="{{ '/favicon.ico' | relative_url }}" type="image/x-icon"> 
</head>



<body>
  <header>
    <h1>The Stuff I Have Online</h1>
    <div class="header-actions">
      <a class="knowledge-architect-link" href="https://thestuffihave.online/fletcherlite/">
        <span class="knowledge-architect-button">I'm lost</span>
        <span class="knowledge-architect-prompt">Looking for the knowledge architect?</span>
      </a>
      <button id="theme-toggle" type="button" aria-label="Toggle color theme">
        🌓
      </button>
    </div>
  </header>
  <div class="main-content">
    {% include sidebar.html %}
    <div class="left-aligned-content">
      {{ content }}
    </div>
  </div>
  <footer>
   <p>&copy; 2026 Built with <a href="https://github.com/fdanilogamu/fdanilogamu.github.io" target="_blank" rel="noopener noreferrer">Git</a> and grit by Fletcher Galeano &middot; v1.0.0 &middot; <a href="/show-and-tell/">Show &amp; Tell Nook</a> &middot; {% include contact-emails.html %}</p>
  </footer>

<script>
  const toggle = document.getElementById('theme-toggle');
  const currentTheme = localStorage.getItem('theme');

  if (currentTheme) {
    document.documentElement.setAttribute('data-theme', currentTheme);
  }

  toggle?.addEventListener('click', () => {
    const html = document.documentElement;
    const newTheme = html.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
    html.setAttribute('data-theme', newTheme);
    localStorage.setItem('theme', newTheme);
  });
</script>

</body>
</html>
